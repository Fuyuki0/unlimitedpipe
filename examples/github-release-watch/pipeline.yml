# Get notified of new releases of the tools you depend on, through GitHub's official API.
# Works without a token (60 requests per hour); set GITHUB_TOKEN for 5,000 per hour.
name: github-releases

sources:
  - type: github
    resource: releases
    repo:
      - astral-sh/uv
      - ollama/ollama
      - pallets/click
    limit: 10

operators:
  - type: diff
    only: [added]
    emit_initial: true   # the first run fills the feed with the latest releases
  - type: sort
    by: [published_at]
    reverse: true

outputs:
  - type: feed
    path: releases.xml
    title: Releases I depend on
  - type: pretty
