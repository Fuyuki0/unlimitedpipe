# Hashtags suddenly rising on English-language Bluesky, live. Runs until Ctrl+C.
# Needs the optional WebSocket client: pip install "unlimitedpipe[live]"
name: bluesky-trends

sources:
  - type: bluesky
    lang: [en]

operators:
  - type: count
    by: tags          # hashtags from each post's facets
    distinct: author_key   # count people, not posts: one bot posting 100 times counts once
    every: 10m
  - type: trend       # compares each 10-minute window with the previous hour
    min_count: 5

outputs:
  - type: pretty
  - type: jsonl
    path: trends.jsonl
    append: true
