# Follow a topic across several sources and keep a spreadsheet of what was said.
name: local-llm-research

sources:
  - type: rss
    url:
      - https://hnrss.org/frontpage
      - https://simonwillison.net/atom/everything/
  - type: github
    resource: releases
    repo: [ollama/ollama, ggml-org/llama.cpp]
    limit: 10

operators:
  - type: grep
    patterns: [llama, ollama, local model, local models, gguf, quantization]
  - type: dedupe
    by: [link]
  - type: sort
    by: [published_at]
    reverse: true
  - type: select
    fields: [published_at, title, link=link|url, from=feed.title|repo]

outputs:
  - type: csv
    path: research.csv
  - type: pretty
