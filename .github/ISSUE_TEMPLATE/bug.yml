name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: command
    attributes:
      label: Command or pipeline
      description: The exact command or YAML you ran. Replace private URLs if needed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
      description: Include the full error output (run with `unlimited -vv ...` for details).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `unlimited --version` and your Python version and OS
    validations:
      required: true
