[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "unlimitedpipe"
dynamic = ["version"]
description = "Pipe the public internet: collect, transform, diff and publish public web data as JSONL events."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "UnlimitedPipe contributors" }]
keywords = ["cli", "jsonl", "pipeline", "rss", "feeds", "change-detection", "web", "scraping", "monitoring", "yahoo-pipes", "github-actions", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "click>=8.1",
    "feedparser>=6.0",
    "httpx>=0.27",
    "lxml>=5.0",
    "platformdirs>=4.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/Fuyuki0/unlimitedpipe"
Documentation = "https://github.com/Fuyuki0/unlimitedpipe/tree/main/docs"
Changelog = "https://github.com/Fuyuki0/unlimitedpipe/blob/main/CHANGELOG.md"
Issues = "https://github.com/Fuyuki0/unlimitedpipe/issues"
"Feed catalog" = "https://fuyuki0.github.io/unlimitedpipe-feed-demo/"

[project.scripts]
unlimited = "unlimitedpipe.cli:main"

[project.optional-dependencies]
live = ["websockets>=12"]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380", "websockets>=12"]

[tool.hatch.version]
path = "src/unlimitedpipe/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/unlimitedpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF012"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
